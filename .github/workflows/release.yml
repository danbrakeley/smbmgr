name: Release

# Push a "v*" tag to build and attach binaries to a GitHub Release.
# workflow_dispatch runs the same build+package steps without creating a
# release, for manual test builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # only needed for the release job's upload

jobs:
  # Fails fast on a tag that doesn't match CMakeLists.txt's VERSION, before
  # the windows/linux jobs spend runner minutes. The `if:` is on the step, not
  # the job: a skipped job would also skip windows/linux, which must still run
  # under workflow_dispatch.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify CMakeLists.txt VERSION matches the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cmake_version=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cmake_version" != "$tag_version" ]; then
            echo "::error::CMakeLists.txt VERSION ($cmake_version) does not match tag $GITHUB_REF_NAME (expected $tag_version)"
            exit 1
          fi
          echo "CMakeLists.txt VERSION ($cmake_version) matches tag $GITHUB_REF_NAME"

  windows:
    needs: check-version
    runs-on: windows-latest # currently Visual Studio 2026, matching CMakePresets.json's "windows" preset generator
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the build embeds a git-describe-derived
          # version (cmake/GenerateBuildInfo.cmake) in the About dialog, and
          # the default shallow/no-tags checkout can't see the "v*" tags it
          # needs to compute that.
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.11.1 (the local dev kit CMakePresets.json's "windows" preset points
          # at) isn't installable via aqtinstall yet, so CI pins an older version
          # that aqt has for this arch. Keep this in sync with the path used to
          # override CMAKE_PREFIX_PATH in the Configure step below.
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          # Qt SVG ships as an archive inside the base kit for this arch (confirmed
          # via `aqt list-qt windows desktop --archives 6.8.3 win64_msvc2022_64`),
          # not as an addon module — requesting it via `modules:` errors because
          # there's no separate "qtsvg" module to request.
          dir: '${{ github.workspace }}/qt'

      - name: Configure
        # Override CMAKE_PREFIX_PATH: the "windows" preset hardcodes a local dev
        # Qt install path, CI's Qt lives wherever install-qt-action put it.
        # windows is a multi-config (Visual Studio) preset, so this one configure
        # covers both the Debug build below (for tests) and the Release build.
        run: cmake --preset windows -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/6.8.3/msvc2022_64"

      - name: Build tests
        # The Visual Studio generator needs the subdirectory-qualified target
        # name. Unit suites only: this runner can't run the docker ones.
        run: cmake --build --preset windows-debug --target tests/hlm_tests_unit --parallel

      - name: Run tests
        # windows-all needs Docker, and GitHub's windows runners can't run the
        # Linux containers the Samba fixture needs — docker-labeled suites run
        # on the linux job instead. This still runs every Windows-buildable
        # serverless suite.
        run: ctest --preset windows-unit

      - name: Build release
        # --target hardlinkmgr: only the app is part of the shipped artifact;
        # the tst_* suites above were already excluded from ALL and only get
        # built on request (see EXCLUDE_FROM_ALL in the top-level CMakeLists.txt).
        run: cmake --build --preset windows-release --target hardlinkmgr --parallel

      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse "build/windows/bin/Release" "hardlinkmgr-windows-x64"
          Compress-Archive -Path "hardlinkmgr-windows-x64" -DestinationPath "hardlinkmgr-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: hardlinkmgr-windows-x64.zip

  linux:
    needs: check-version
    runs-on: ubuntu-26.04 # matches the version the linux-* presets are documented/tested against
    steps:
      - uses: actions/checkout@v7
        with:
          # See the equivalent comment in the windows job.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev qt6-wayland libgl1-mesa-dev

      - name: Configure (debug, for tests)
        run: cmake --preset linux-debug

      - name: Build tests
        # hlm_tests (not hlm_tests_unit): linux-all below runs the full suite
        # including the docker-fixture suites, so all of them need building.
        run: cmake --build --preset linux-debug --target hlm_tests --parallel

      - name: Run tests
        # linux-all: the ubuntu runner has Docker + Compose v2 preinstalled, so
        # (unlike the windows job) the docker-labeled Samba-backed suites run
        # here too, giving full coverage across the two jobs.
        run: ctest --preset linux-all

      - name: Configure (release)
        run: cmake --preset linux-release

      - name: Build release
        # --target hardlinkmgr: see the equivalent comment in the windows job —
        # only the app ships, tests are excluded from ALL and built on request.
        run: cmake --build --preset linux-release --target hardlinkmgr --parallel

      - name: Package .deb
        run: |
          cd build/linux-release
          cpack -G DEB

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: build/linux-release/*.deb

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/windows-release/*.zip
            artifacts/linux-release/*.deb
