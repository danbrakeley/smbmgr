name: PR Version Check

# Every PR into main must bump CMakeLists.txt's VERSION. Releases are cut by
# hand and won't happen for every merge, but every commit on main needs to be
# able to produce a uniquely-versioned build.
on:
  pull_request:
    branches: [main]

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: need to read CMakeLists.txt as it exists at the PR's
          # base commit to diff against, not just the merged working tree.
          fetch-depth: 0

      - name: Verify CMakeLists.txt VERSION was bumped from main
        # project_version reads VERSION from inside project(...) only, which
        # can span lines (-z reads the whole input as one record), so other
        # VERSION arguments such as cmake_minimum_required's can't match.
        run: |
          project_version() {
            grep -Pzo '(?ms)^\s*project\s*\([^)]*?\bVERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' | tr '\0' '\n' | head -1
          }
          pr_version=$(project_version < CMakeLists.txt)
          base_version=$(git show "${{ github.event.pull_request.base.sha }}:CMakeLists.txt" | project_version)

          echo "main VERSION: $base_version"
          echo "PR VERSION:   $pr_version"

          if [ "$pr_version" = "$base_version" ]; then
            echo "::error::CMakeLists.txt VERSION ($pr_version) wasn't bumped from main ($base_version). Every PR into main must bump the version so a unique build can be made from the merge."
            exit 1
          fi

          highest=$(printf '%s\n%s\n' "$base_version" "$pr_version" | sort -V | tail -1)
          if [ "$highest" != "$pr_version" ]; then
            echo "::error::CMakeLists.txt VERSION ($pr_version) is lower than main's ($base_version). The bump must increase the version, not decrease it."
            exit 1
          fi

          echo "VERSION bumped: $base_version -> $pr_version"
