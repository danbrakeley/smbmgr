# Minimal Samba config for the smbmgr test fixture (see Dockerfile).
# Hard links over SMB2 (FILE_LINK_INFORMATION) map straight to link(2) on the
# share filesystem — no special options needed; keep this small to reduce the
# gap between "works here" and "works against the real server".

[global]
  server role = standalone server
  security = user
  map to guest = never
  server min protocol = SMB2_10
  disable netbios = yes
  smb ports = 445
  load printers = no
  log level = 1
  logging = file

[share]
  path = /srv/share
  valid users = smbmgrtest
  writeable = yes
  create mask = 0664
  directory mask = 0775
